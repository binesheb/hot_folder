name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile prototype
        run: python -m py_compile source_code
      - name: Verify runtime imports
        run: python -c "import runpy; runpy.run_path('source_code', run_name='__ci__')"
